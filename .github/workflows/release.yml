name: release

# GitHub'da bir release yayımlandığında (Releases > Draft a new release > Publish)
# programı derler, paketler ve paketleri o release'e ekler.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Paketlerin ekleneceği mevcut release etiketi (ör. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Arayüzü derle
        run: cd webapp && npm ci && npm run build

      - name: Testler
        run: go vet ./... && go test ./...

      - name: Paketle
        run: |
          VERSION="${TAG#v}"
          mkdir -p dist
          for ARCH in amd64 arm64; do
            rm -rf build && mkdir -p build/haproxy-lens
            CGO_ENABLED=0 GOOS=linux GOARCH="$ARCH" go build -trimpath \
              -ldflags="-s -w -X main.version=$VERSION" -o build/haproxy-lens/haproxy-lens .
            cp deploy/install.sh deploy/uninstall.sh README.md README.tr.md LICENSE build/haproxy-lens/
            chmod 0755 build/haproxy-lens/haproxy-lens build/haproxy-lens/install.sh build/haproxy-lens/uninstall.sh
            tar -C build -czf "dist/haproxy-lens-linux-$ARCH.tar.gz" haproxy-lens
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS)

      - name: Release'e ekle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber
