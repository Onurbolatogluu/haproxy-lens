name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Arayüzü derle
        run: cd webapp && npm ci && npm run build

      - name: Kontrol ve testler
        run: |
          test -z "$(gofmt -l $(git ls-files '*.go'))" || { echo "gofmt gerekli:"; gofmt -l $(git ls-files '*.go'); exit 1; }
          go vet ./...
          go test ./...

      - name: Yarış durumu denetimi
        # Pollerlar, log okuyucu ve HTTP istekleri aynı anda çalışır; paylaşılan veriye
        # kilitsiz erişim burada yakalanır.
        run: go test -race -short ./...

      - name: Derleme denemesi
        run: CGO_ENABLED=0 go build -trimpath -o haproxy-lens . && ./haproxy-lens -version

      - name: Betik denetimi
        run: |
          bash -n deploy/install.sh && bash -n deploy/uninstall.sh
          # Sürüm sabit: kurallar sürümler arasında değişiyor (0.9 ile 0.11 aynı dosyaya
          # farklı notlar veriyor); yerel denetim ile CI aynı sonucu versin.
          curl -sSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz | tar xJ
          ./shellcheck-v0.11.0/shellcheck -S info deploy/install.sh deploy/uninstall.sh build.sh
